name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  prepare-smoke:
    runs-on: ubuntu-26.04
    outputs:
      includes: ${{ steps.smoke.outputs.matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Smoke test matrix
        id: smoke
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          target: smoke-test
          fields: platforms

  smoke:
    runs-on: ${{ startsWith(matrix.platforms, 'linux/arm') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    needs:
      - prepare-smoke
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-smoke.outputs.includes) }}
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Test
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          targets: smoke-test
          set: |
            *.platform=${{ matrix.platforms }}
